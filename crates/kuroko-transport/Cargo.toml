[package]
name = "kuroko-transport"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = [
  "sink",
  "std",
] }
kuroko-core = { version = "2026.11.1", path = "../kuroko-core" }
kuroko-engine = { version = "2026.11.1", path = "../kuroko-engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "process", "io-util", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "net"] }

[lints]
workspace = true
