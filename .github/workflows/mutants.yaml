# Mutation testing runs here rather than in `nix flake check`, because a full run
# takes far longer than every other check together. `--iterate` never retests a
# mutant an earlier run recorded as caught or unviable: a pull request tests the
# changed lines that are not already recorded, and main tests everything not
# already recorded. The first run on main is therefore the only full one; delete
# the branch's cache entries to force another. A test weakened after its mutant
# was recorded as caught stays undetected until then. Only `crates/` is gated;
# `apps/` is untestable I/O wiring and stays exempt.
#
# `--timeout 120` overrides the auto timeout of 10x baseline test time. Under
# eight jobs on a shared runner, a mutant whose killing test waits out a bound
# or shrinks a proptest case can run past 20s while still being killed, and
# cargo-mutants counts a timeout as a gate failure.
name: mutants
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  id-token: write
  contents: read
jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The three-dot diff needs a merge base with the base branch.
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@v3.24.2
      - uses: DeterminateSystems/flakehub-cache-action@v3.24.2
      - uses: actions/cache/restore@v6.1.0
        with:
          path: mutants.out
          key: mutants-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          # A run continues from its own branch; a pull request may also start
          # from main's history. Main never inherits a pull request's cache.
          restore-keys: |
            mutants-${{ github.head_ref }}-
            mutants-main-
      - name: Diff against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # fetch-depth: 0 already fetched every head into refs/remotes/origin.
        run: git diff --no-color "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.diff"
      - name: Run mutants
        env:
          # Without the `|| ''` a non-pull_request event yields the boolean
          # false, which GitHub passes as the literal string "false".
          DIFF: ${{ github.event_name == 'pull_request' && format('{0}/changed.diff', runner.temp) || '' }}
        run: |
          nix develop --command cargo mutants \
            --workspace \
            --exclude 'apps/**' \
            --jobs 8 \
            --iterate \
            --timeout 120 \
            ${DIFF:+--in-diff "$DIFF"}
      - uses: actions/cache/save@v6.1.0
        # An empty diff, a diff without Rust files, or a diff that matches no
        # mutant exits before cargo-mutants creates mutants.out.
        if: always() && hashFiles('mutants.out/mutants.json') != ''
        with:
          path: mutants.out
          key: mutants-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
