[package]
name = "kuroko"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
axum = "0.8.9"
env_logger = "0.11.11"
kuroko-core = { version = "2026.11.1", path = "../../crates/kuroko-core" }
kuroko-engine = { version = "2026.11.1", path = "../../crates/kuroko-engine" }
kuroko-linear = { version = "2026.11.1", path = "../../crates/kuroko-linear" }
kuroko-transport = { version = "2026.11.1", path = "../../crates/kuroko-transport" }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "time",
] }
toml = "1.2.1"

[dev-dependencies]
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.1"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
